name: Long Beach blue-whale monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "blue_whale_monitor/**"
      - ".github/workflows/blue-whale-monitor.yml"
  pull_request:
    paths:
      - "blue_whale_monitor/**"
      - ".github/workflows/blue-whale-monitor.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: long-beach-blue-whale-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      LOOKBACK_DAYS: "14"
      EARLY_ALERT_DATE: "2026-08-04"
      FAMILY_ALERT_DATE: "2026-08-17"
      ALERT_ASSIGNEE: "jlmcnamara"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: blue_whale_monitor/requirements.txt

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r blue_whale_monitor/requirements.txt

      - name: Run unit tests
        run: python -m unittest discover -s blue_whale_monitor -p "test_*.py"

      - name: Validate alert format on pull request
        if: github.event_name == 'pull_request'
        run: python -m blue_whale_monitor.alert_delivery --dry-run

      - name: Send one-time alert-format email test
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[format-test]')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > /tmp/whale-alert-test.md <<'EOF'
          # CHECK THE NEXT 72 HOURS

          **Format test only — this is not a live whale sighting.**

          ## Latest evidence

          **Thu, Aug 6 at 3:00 PM PT — Harbor Breeze official sightings**

          2 Blue Whales feeding in the San Pedro Channel.

          [Open source](https://harbor-cruises.com/harbor-cruises-sightings/)

          ## Next action

          - Check the next few Long Beach stadium-seat departures.
          - Open the source before booking.

          **Signal rule:** actual emails use this structure only for a new qualifying sighting. Routine workflow-health messages are excluded.
          EOF
          gh issue create --repo "$GITHUB_REPOSITORY" --title "🐋 BLUE WHALE ALERT | Long Beach | TEST ONLY" --body-file /tmp/whale-alert-test.md --assignee jlmcnamara

      - name: Check for new sightings and create a distinct alert
        if: github.event_name != 'pull_request'
        run: python -m blue_whale_monitor.alert_delivery
