name: Blue whale Gmail filter test (one-shot)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/blue-whale-filter-test-once.yml"

permissions:
  contents: read
  issues: write

jobs:
  mention:
    runs-on: ubuntu-latest
    steps:
      - name: Mention owner once
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 9 --repo jlmcnamara/surfbot --body '@jlmcnamara'
